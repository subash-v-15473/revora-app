<style>
html,body{margin:0}
/* Layout: dark sidebar (nav) | main column (greeting, KPI cards, pipeline strip, cars table, widgets row) | right panel (selected car). Sidebar becomes a bottom nav and the right panel a full-screen sheet on phones. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef1f6; --line:#e5e9f0; --line-strong:#cfd6e0;
  --fg:#0f172a; --fg-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --side:#ffffff; --side-2:#eef3ff; --side-fg:#0f172a; --side-muted:#5b6b85; --side-line:#e5e9f0;
  --blue:#2563eb; --blue-soft:#e3ecfd; --green:#16a34a; --green-soft:#dcf5e5; --orange:#f97316; --orange-soft:#ffecd9; --purple:#7c3aed; --purple-soft:#ece4fd; --red:#dc2626; --red-soft:#fde3e3; --teal:#0d9488; --teal-soft:#d9f3ef; --amber:#d97706; --amber-soft:#fdf0d5;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 6px rgba(15,23,42,.04); --shadow:0 10px 30px rgba(15,23,42,.12); --shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --r:14px; --r-sm:10px; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#121a2e; --surface-2:#172038; --surface-3:#1d2742; --line:#222c47; --line-strong:#34405f;
  --fg:#eef2fa; --fg-2:#c7d0e3; --muted:#8e9ab8; --faint:#5c688a;
  --side:#121a2e; --side-2:#1b2542; --side-fg:#eef2fa; --side-muted:#8e9ab8; --side-line:#222c47;
  --blue:#5b8cff; --blue-soft:#172a55; --green:#3ad17a; --green-soft:#0f3322; --orange:#ff954d; --orange-soft:#3d2410; --purple:#a98bff; --purple-soft:#2a1f4d; --red:#ff6b6b; --red-soft:#3f1a1a; --teal:#2fc4b4; --teal-soft:#0f3331; --amber:#f5b041; --amber-soft:#3a2a10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.8);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface-2:#172038; --surface-3:#1d2742; --line:#222c47; --line-strong:#34405f;
  --fg:#eef2fa; --fg-2:#c7d0e3; --muted:#8e9ab8; --faint:#5c688a;
  --side:#121a2e; --side-2:#1b2542; --side-fg:#eef2fa; --side-muted:#8e9ab8; --side-line:#222c47;
  --blue:#5b8cff; --blue-soft:#172a55; --green:#3ad17a; --green-soft:#0f3322; --orange:#ff954d; --orange-soft:#3d2410; --purple:#a98bff; --purple-soft:#2a1f4d; --red:#ff6b6b; --red-soft:#3f1a1a; --teal:#2fc4b4; --teal-soft:#0f3331; --amber:#f5b041; --amber-soft:#3a2a10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.8);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
img{max-width:100%;display:block}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-height:100%}
@media (max-width:1180px){ .app{grid-template-columns:210px minmax(0,1fr)} #panelCol{display:none} }
@media (max-width:760px){ .app{grid-template-columns:1fr} }

/* sidebar */
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;height:100dvh;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.brand .mark svg{width:24px;height:24px}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1}
.brand small{font-size:11.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--side-muted);font-weight:600;font-size:14px;width:100%;transition:background .18s,color .18s,transform .18s}
.nav button:hover{transform:translateX(3px)}
.nav button:active{transform:translateX(3px) scale(.98)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--side-2);color:var(--side-fg)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.nav .n{margin-left:auto;font-size:11px;background:var(--side-2);color:var(--blue);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav button.on .n{background:rgba(255,255,255,.25)}
.side .spacer{flex:1}
.promo{background:linear-gradient(135deg,var(--side-2),var(--green-soft));border-radius:14px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.promo .em{font-size:26px}
.promo b{font-size:14px}
.promo small{font-size:12px;color:var(--side-muted)}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--side-line);margin-top:12px}
.me .iconbtn{color:var(--side-muted)}
.me .iconbtn:hover{color:var(--red);background:var(--red-soft)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.me b{display:block;font-size:14px}
.me small{font-size:12px;color:var(--side-muted)}
@media (max-width:760px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;border-top:1px solid var(--side-line);border-right:0;box-shadow:0 -4px 16px rgba(15,23,42,.06);gap:0;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand,.promo,.me,.side .spacer{display:none}
  .nav{flex-direction:row;gap:2px;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:4px;padding:8px 6px;font-size:10.5px;border-radius:10px;flex:1 0 auto;min-width:64px;align-items:center}
  .nav .n{display:none}
}

/* main */
.main{min-width:0;padding:18px 24px 120px;display:flex;flex-direction:column;gap:22px;padding-right:max(24px,env(safe-area-inset-right,0px))}
#view{display:flex;flex-direction:column;gap:22px}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
body.boot .topbar,body.boot #view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
body.boot #view>*:nth-child(1){animation-delay:.05s} body.boot #view>*:nth-child(2){animation-delay:.12s} body.boot #view>*:nth-child(3){animation-delay:.19s} body.boot #view>*:nth-child(4){animation-delay:.26s} body.boot #view>*:nth-child(5){animation-delay:.33s}
body.boot .kpi{animation:pop .45s cubic-bezier(.2,.8,.2,1) both} body.boot .kpi:nth-child(2){animation-delay:.08s} body.boot .kpi:nth-child(3){animation-delay:.16s} body.boot .kpi:nth-child(4){animation-delay:.24s}
body.boot .nav button{animation:rise .4s both} body.boot .nav button:nth-child(2){animation-delay:.04s} body.boot .nav button:nth-child(3){animation-delay:.08s} body.boot .nav button:nth-child(4){animation-delay:.12s} body.boot .nav button:nth-child(5){animation-delay:.16s} body.boot .nav button:nth-child(6){animation-delay:.2s} body.boot .nav button:nth-child(7){animation-delay:.24s}
body.boot .pstage{animation:pop .4s both} body.boot .pstage:nth-of-type(2){animation-delay:.06s} body.boot .pstage:nth-of-type(3){animation-delay:.12s} body.boot .pstage:nth-of-type(4){animation-delay:.18s} body.boot .pstage:nth-of-type(5){animation-delay:.24s} body.boot .pstage:nth-of-type(6){animation-delay:.3s} body.boot .pstage:nth-of-type(7){animation-delay:.36s}
.row{animation:rise .3s cubic-bezier(.2,.8,.2,1) both} .row:nth-child(2){animation-delay:.04s} .row:nth-child(3){animation-delay:.08s} .row:nth-child(4){animation-delay:.12s} .row:nth-child(5){animation-delay:.16s} .row:nth-child(n+6){animation-delay:.2s}
.pbody,.pempty{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.panel .ph img{animation:pop .35s both}
.chart path[stroke]{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s .3s ease-out forwards}
.toast{animation:rise .25s both}
.modal{animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
.sheetwrap .panel{animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){ .main{padding:12px max(14px,env(safe-area-inset-right,0px)) 110px max(14px,env(safe-area-inset-left,0px));gap:16px} #view{gap:16px} }
.topbar{display:flex;align-items:center;gap:12px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;box-shadow:var(--shadow-sm);min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:0;height:100%;box-shadow:none}
.search input:focus{box-shadow:none}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);animation:livep 2s infinite}
@keyframes livep{0%,100%{box-shadow:0 0 0 3px var(--green-soft)}50%{box-shadow:0 0 0 6px var(--green-soft)}}
.live.err .dot{background:var(--red)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow-sm);color:var(--fg-2);flex:none;transition:transform .2s,box-shadow .2s}
.bell:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.bell:hover svg{animation:swing .6s ease-in-out}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.bell svg{width:19px;height:19px}
.bell .b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.topbar .avatar{width:42px;height:42px}
@media (max-width:760px){ .topbar .avatar{display:none} .live span.t{display:none} .live{padding:0 12px} #topOut{display:grid!important} }
.brandm{display:none;align-items:center;gap:8px;font-weight:800;font-size:16px}
.brandm .mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brandm .mark svg{width:20px;height:20px}
@media (max-width:760px){ .brandm{display:flex} }

.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:26px;font-weight:800}
.greet p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
@media (max-width:760px){ .greet h1{font-size:21px} }
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .18s,transform .15s,box-shadow .18s,filter .18s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.10)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn svg{transition:transform .2s}
.btn:hover svg:last-child{transform:translateX(2px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--red-soft);border-color:transparent;color:var(--red);box-shadow:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:none;box-shadow:none;color:var(--blue);padding:0;font-weight:600}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1000px){ .kpis{grid-template-columns:repeat(2,1fr)!important} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-sm);min-width:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--blue-soft)}
.kpi .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.kpi:hover .ic{transform:scale(1.1) rotate(-4deg)}
.kpi .ic svg{width:24px;height:24px}
.kpi .ic.blue{background:var(--blue-soft);color:var(--blue)} .kpi .ic.green{background:var(--green-soft);color:var(--green)} .kpi .ic.orange{background:var(--orange-soft);color:var(--orange)} .kpi .ic.purple{background:var(--purple-soft);color:var(--purple)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.delta{font-size:11.5px;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:2px}
.delta.neg{color:var(--red)}
@media (max-width:760px){ .kpi{padding:12px 14px;gap:10px} .kpi .ic{width:42px;height:42px;border-radius:12px} .kpi .v{font-size:18px} }

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);min-width:0;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:0 6px 24px rgba(15,23,42,.08)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card .hd h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .bd{padding:16px 20px 20px}

/* pipeline */
.pipe{display:flex;align-items:flex-start;gap:4px;overflow-x:auto;padding:14px 18px 20px;scrollbar-width:none}
.pipe::-webkit-scrollbar{display:none}
.pstage{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;padding:8px 4px;border-radius:12px;transition:background .18s,transform .18s}
.pstage:hover{background:var(--surface-2);transform:translateY(-2px)}
.pstage.on{background:var(--surface-3)}
.pstage .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pstage:hover .ic{transform:scale(1.15);box-shadow:0 6px 14px rgba(15,23,42,.12)}
.pstage.on .ic{box-shadow:0 0 0 4px var(--surface),0 0 0 6px currentColor}
.pstage .ic svg{width:20px;height:20px}
.pstage b{font-size:13px;font-weight:700;color:var(--fg-2);line-height:1.2}
.pstage small{font-size:12px;color:var(--muted)}
.parrow{flex:0 0 28px;align-self:flex-start;margin-top:14px;color:var(--faint)}
.parrow svg{width:28px;height:28px}
.c-blue{background:var(--blue-soft);color:var(--blue)} .c-green{background:var(--green-soft);color:var(--green)} .c-orange{background:var(--orange-soft);color:var(--orange)} .c-purple{background:var(--purple-soft);color:var(--purple)} .c-teal{background:var(--teal-soft);color:var(--teal)} .c-red{background:var(--red-soft);color:var(--red)} .c-amber{background:var(--amber-soft);color:var(--amber)} .c-gray{background:var(--surface-3);color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:background .18s,color .18s,transform .15s,border-color .18s}
.chip:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* car rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px minmax(160px,1.4fr) minmax(120px,1fr) minmax(220px,1.3fr) auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .18s,box-shadow .18s;position:relative}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--blue);transform:scaleY(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.row:hover{background:var(--surface-2)}
.row:hover::before,.row.sel::before{transform:scaleY(1)}
.row.sel{background:var(--blue-soft)}
.row:hover .act .btn{background:var(--blue);color:#fff;border-color:var(--blue)}
.thumb{width:92px;height:66px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.spec{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.spec .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.spec .v{font-size:14px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.regplate{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.08em;font-size:13px;background:#fff6c7;color:#3b3000;border:1.5px solid #c9b64a;border-radius:5px;padding:2px 10px}
.ok-box{background:var(--green-soft);color:var(--green);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s both}
.ok-box .ic{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.ok-box .ic svg{width:16px;height:16px}
.ok-box b{display:block;font-size:15px}
.ok-box span{font-size:13px;color:var(--fg-2)}
.copybox{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;color:var(--fg-2)}
.sfoot{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 16px 0}
.sfoot button{color:var(--blue);font-weight:600}
/* ---- appointments (admin) ---- */
.appt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);animation:rise .3s both}
.appt .when{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:8px 12px;text-align:center;min-width:76px}
.appt .when b{display:block;font-size:18px;font-weight:800;line-height:1.1}
.appt .when small{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.appt .when .t{display:block;font-size:12px;font-weight:700;margin-top:3px;color:var(--fg-2)}
.appt .tx b{display:block;font-size:14.5px}
.appt .tx .s{font-size:13px;color:var(--muted);margin-top:2px}
.appt .tx .s a{color:var(--blue)}
.appt .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.appt.conv{opacity:.75}
.pill.new{background:var(--orange-soft);color:var(--orange)} .pill.confirmed{background:var(--blue-soft);color:var(--blue)} .pill.converted{background:var(--green-soft);color:var(--green)} .pill.cancelled{background:var(--red-soft);color:var(--red)}
@media (max-width:700px){ .appt{grid-template-columns:auto minmax(0,1fr)} .appt .ac{grid-column:1/-1;justify-content:flex-start} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="setup" hidden></div>
<div id="login" hidden></div>
<div id="store" class="store" hidden></div>
<div class="app" id="adminApp" hidden>
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h-1a1 1 0 0 1-1-1v-4l2.3-5.4A2 2 0 0 1 7.1 5h9.8a2 2 0 0 1 1.8 1.2L21 12v4a1 1 0 0 1-1 1h-1"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5M3 12h18"/></svg></span><div><b>Revora</b><small>Used Car Business</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="promo"><span class="em">🤝</span><b>Grow Together</b><small>Track. Sell. Profit.</small></div>
    <div class="me"><span class="avatar" id="meAv">?</span><div style="min-width:0;flex:1"><b id="meName">Admin</b><small>Revora admin</small></div><button class="iconbtn" data-act="signOut" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-7"/></svg></button></div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <div class="brandm"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h-1a1 1 0 0 1-1-1v-4l2.3-5.4A2 2 0 0 1 7.1 5h9.8a2 2 0 0 1 1.8 1.2L21 12v4a1 1 0 0 1-1 1h-1"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg></span></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search cars, customers…" aria-label="Search"></div>
      <div class="live" id="live"><span class="dot"></span><span class="t" id="liveText">Connecting</span></div>
      <button class="bell" id="bell" aria-label="Pending actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v4l2 3H4l2-3z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="b" id="bellN" hidden></span></button>
      <span class="avatar" id="topAv">?</span>
      <button class="bell" data-act="signOut" aria-label="Sign out" title="Sign out" style="display:none" id="topOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-7"/></svg></button>
    </div>
    <div id="view"></div>
  </main>

  <aside id="panelCol"><div class="panel" id="panel"></div></aside>
</div>
<div id="sheet" hidden></div>
<div id="overlay" hidden></div>
<div id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inrF=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const money=n=>(n==null||n===''||isNaN(n))?'—':inrF.format(Number(n));
const lakh=n=>{ n=Number(n); if(!n) return '₹0'; const neg=n<0; n=Math.abs(n); let s; if(n>=1e7) s='₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+'Cr'; else if(n>=1e5) s='₹'+(n/1e5).toFixed(n>=1e6?1:2).replace(/\.?0+$/,'')+'L'; else s=inrF.format(n); return (neg?'−':'')+s; };
const kmF=n=>n?Number(n).toLocaleString('en-IN')+' km':'';
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{ if(!d) return '—'; const x=new Date(d); return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); };
const fmtDT=iso=>new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const ago=iso=>{ if(!iso) return ''; const s=(Date.now()-new Date(iso).getTime())/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' hours ago'; const d=Math.floor(s/86400); return d===1?'1 day ago':d+' days ago'; };
const initials=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const I=(p,sw=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={car:'<path d="M5 17h-1a1 1 0 0 1-1-1v-4l2.3-5.4A2 2 0 0 1 7.1 5h9.8a2 2 0 0 1 1.8 1.2L21 12v4a1 1 0 0 1-1 1h-1"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5M3 12h18"/>',
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5.5"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>', doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h6"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  rupee:'<path d="M6 4h12M6 9h12M6 4c6 0 8 2 8 5s-2 5-8 5l8 6"/>', trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cart:'<path d="M3 4h2l2.4 11h11.2L21 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>', tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>', card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', l:'<path d="M15 5l-7 7 7 7"/>', r:'<path d="M9 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
  flag:'<path d="M5 21V4h11l-1.5 4L16 12H5"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'};

const STAGES=[
  {id:'purchased',label:'Purchased',short:'Bought',ic:'cart',c:'blue'},
  {id:'listed',label:'Listed',short:'Listed',ic:'tag',c:'blue'},
  {id:'customer',label:'Customer Enquiry',short:'Enquiry',ic:'users',c:'purple'},
  {id:'payment',label:'Payment Pending',short:'Payment',ic:'card',c:'orange'},
  {id:'sold',label:'Sale Completed',short:'Sold',ic:'check',c:'green'},
  {id:'rc',label:'RC Transfer Pending',short:'RC',ic:'doc',c:'purple'},
  {id:'done',label:'Completed',short:'Done',ic:'flag',c:'teal'},
];
const stageIdx=id=>STAGES.findIndex(s=>s.id===id);
const stageOf=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const PLATFORMS=['OLX','CarDekho','Cars24','Spinny','Facebook Marketplace','Droom','CarWale','Quikr','Word of mouth','Other'];
const FUELS=['Petrol','Diesel','CNG','Electric','Hybrid'], TRANS=['Manual','Automatic'], OWNERS=['1st owner','2nd owner','3rd owner','4th+ owner'];
const RC_STEPS=[['pending','Not started'],['forms','Form 29/30 signed'],['applied','Applied at RTO'],['done','Transferred']];
const VIEWS=[['dashboard','Dashboard','home'],['inventory','Inventory','car'],['appointments','Appointments','cal'],['customers','Customers','users'],['payments','Payments','wallet'],['rc','RC Transfer','doc'],['reports','Reports','chart'],['settings','Settings','gear']];
const ADMIN_EMAIL='revoraadmin@revora.com';
const APPT_STATUS={new:'New',confirmed:'Confirmed',converted:'Visited',cancelled:'Cancelled'};

let appts=[],mode='store',storeSel=null,storePh=0,booked=null,bookFail=null,authReady=false;
let db=null,user=null,assets=null,cars=[],view='dashboard',filter='all',search='',selId=null,tab='overview',photoIdx=0,lbIdx=-1,confirmKey=null,names={},me={name:'',avatar:'',email:''},myId=null,canWrite=true,loaded=false,uploading=false,sheetOpen=false;
const PH_BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const photoCache={}, photoPending=new Set(); let photoTimer=null;
function blob(id){ id=String(id||''); if(!id) return PH_BLANK; if(!id.startsWith('fs:')) return id;
  if(photoCache[id]) return photoCache[id];
  if(db&&!photoPending.has(id)){ photoPending.add(id); db.collection('photos').doc(id.slice(3)).get().then(s=>{ photoCache[id]=(s.exists&&s.data().data)||PH_BLANK; }).catch(()=>{ photoCache[id]=PH_BLANK; }).finally(()=>{ photoPending.delete(id); clearTimeout(photoTimer); photoTimer=setTimeout(()=>{ if(mode==='admin') renderAll(); else if(mode==='store') renderStore(); },80); }); }
  return PH_BLANK; }
const photos=c=>Array.isArray(c.photos)?c.photos:[];
const narrow=()=>window.matchMedia('(max-width:1180px)').matches;
const sel=()=>cars.find(x=>x.id===selId);

// ---------- derived ----------
const profitOf=c=>(+c.sale?.price||0)-(+c.purchase?.price||0);
const estProfit=c=>stageIdx(c.stage)>=stageIdx('sold')?profitOf(c):((+c.payment?.amount||+c.listing?.price||0)-(+c.purchase?.price||0));
const rcLabel=c=>(RC_STEPS.find(r=>r[0]===(c.rc?.status||'pending'))||RC_STEPS[0])[1];
function needsAttention(c){
  const days=Math.floor((Date.now()-new Date(c.updatedAt||c.createdAt||Date.now()))/86400000);
  if(c.stage==='payment'&&c.payment?.mode==='loan') return {t:'Loan approval for '+c.title,s:'Awaiting '+(c.payment.bank||'bank')+' response · '+days+' days',ic:'bank',c:'blue'};
  if(c.stage==='payment') return {t:'Cash payment for '+c.title,s:'Pending from '+(c.customer?.name||'customer')+' · '+days+' days',ic:'wallet',c:'orange'};
  if(c.stage==='sold') return {t:'RC transfer for '+c.title,s:'Not started yet',ic:'doc',c:'purple'};
  if(c.stage==='rc') return {t:'RC transfer for '+c.title,s:rcLabel(c)+' · '+days+' days',ic:'doc',c:'purple'};
  if(c.stage==='purchased'&&days>3) return {t:'List '+c.title,s:'Bought '+days+' days ago, not listed',ic:'tag',c:'amber'};
  if(c.stage==='listed'&&days>30) return {t:'Review price of '+c.title,s:'Listed '+days+' days, no buyer',ic:'tag',c:'amber'};
  if(c.stage==='customer'&&days>5) return {t:'Follow up '+(c.customer?.name||'customer'),s:c.title+' · enquiry '+days+' days old',ic:'users',c:'purple'};
  return null;
}
function nextStep(c){
  return {purchased:'List the car on OLX, Cars24 or another platform',listed:'Wait for a customer enquiry, or update the price if slow',
    customer:'Agree the price and record cash or loan payment',payment:c.payment?.mode==='loan'?'Follow up with '+(c.payment.bank||'the bank')+' on loan approval':'Collect cash from '+(c.customer?.name||'the customer'),
    sold:'Sign Form 29/30 and start the RC transfer',rc:'Follow up at the RTO until the RC is transferred',done:'Nothing pending. Deal closed.'}[c.stage];
}
function stageSub(c){
  const s=c.stage;
  if(s==='purchased') return 'Bought '+fmtDate(c.purchase?.date);
  if(s==='listed') return 'On '+(c.listing?.platform||'market');
  if(s==='customer') return (c.customer?.name||'Customer')+' checking';
  if(s==='payment') return c.payment?.mode==='loan'?'With '+(c.payment.bank||'bank'):'Cash from '+(c.customer?.name||'customer');
  if(s==='sold') return 'RC not started';
  if(s==='rc') return rcLabel(c);
  return 'Profit '+lakh(profitOf(c));
}
function miniSteps(c){
  const i=stageIdx(c.stage);
  const steps=i>=stageIdx('sold')?[['Sold',stageIdx('sold')],['Payment',stageIdx('sold')],['RC',stageIdx('rc')],['Done',stageIdx('done')]]
    :[['Listed',1],['Enquiry',2],[c.payment?.mode==='loan'?'Loan':'Payment',3],['RC',5]];
  return steps.map(([l,idx])=>{ const st=i>idx?'done':i===idx?'now':''; return `<div class="s ${st}"><div class="d">${st==='done'?I(P.check,3):''}</div><span>${l}</span></div>`; }).join('');
}
function visible(list){
  const q=search.trim().toLowerCase();
  return list.filter(c=>filter==='all'||c.stage===filter)
    .filter(c=>!q||[c.title,c.reg,c.customer?.name,c.customer?.phone,c.listing?.platform,c.city].some(v=>String(v||'').toLowerCase().includes(q)))
    .sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
}
const apptText=a=>`${a.name} has scheduled an appointment to check the ${a.carTitle} on ${fmtApptDT(a)}`;
const fmtApptDT=a=>{ const d=new Date(a.date+'T'+(a.time||'10:00')); return isNaN(d)?a.date+' '+(a.time||''):d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); };
const pendings=()=>[...appts.filter(a=>a.status==='new'||a.status==='confirmed').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>({appt:a,a:{t:(a.status==='new'?'New appointment: ':'Visit: ')+a.name,s:apptText(a).replace(a.name+' has scheduled an appointment to check ','')+(a.phone?' · '+a.phone:''),ic:'cal',c:a.status==='new'?'orange':'blue'}})),...cars.map(c=>({c,a:needsAttention(c)})).filter(x=>x.a)];

// ---------- status / nav ----------
function setLive(kind,text){ const el=$('#live'); el.className='live '+kind; $('#liveText').textContent=text; }
function renderNav(){
  const counts={inventory:cars.filter(c=>c.stage!=='done').length,appointments:appts.filter(a=>a.status==='new').length,payments:cars.filter(c=>c.stage==='payment').length,rc:cars.filter(c=>c.stage==='sold'||c.stage==='rc').length};
  $('#nav').innerHTML=VIEWS.map(([id,l,ic])=>`<button class="${view===id?'on':''}" data-view="${id}">${I(P[ic])}<span>${l}</span>${counts[id]?'<span class="n">'+counts[id]+'</span>':''}</button>`).join('');
  const n=pendings().length; $('#bellN').hidden=!n; $('#bellN').textContent=n;
}
function renderMe(){ const nm=me.name||'Admin'; const av=me.avatar?`<img src="${esc(me.avatar)}" alt="">`:esc(initials(nm)); $('#meAv').innerHTML=av; $('#topAv').innerHTML=av; $('#meName').textContent=nm; }

// ---------- views ----------
function carRow(c){
  const st=stageOf(c.stage), ph=photos(c);
  const pr=stageIdx(c.stage)>=stageIdx('sold')?`Purchased: ${lakh(c.purchase?.price)} · Sold: ${lakh(c.sale?.price)}`:`Purchased: ${lakh(c.purchase?.price)}${c.listing?.price?' · Ask: '+lakh(c.listing.price):''}`;
  return `<div class="row ${c.id===selId?'sel':''}" data-sel="${esc(c.id)}" role="button" tabindex="0">
    <div class="thumb">${ph.length?`<img src="${blob(ph[0])}" alt="" loading="lazy">`:I(P.car,1.6)}</div>
    <div class="t"><b>${esc(c.title)}${c.year?' '+esc(c.year):''}</b><div class="reg">${esc(c.reg||'No reg no')}</div><div class="pr">${pr}</div></div>
    <div style="min-width:0"><span class="pill ${st.id}">${st.label}</span><div class="sub">${esc(stageSub(c))}</div></div>
    <div class="mini">${miniSteps(c)}</div>
    <div class="act"><span class="btn sm">View Details ${I(P.arrow,2.2)}</span></div>
  </div>`;
}
function carsCard(list,title,opts={}){
  const v=visible(list);
  const chips=opts.chips!==false?`<div class="chips">${[['all','All'],...STAGES.map(s=>[s.id,s.label])].filter(([id])=>id==='all'||list.some(c=>c.stage===id)).map(([id,l])=>`<button class="chip ${filter===id?'on':''}" data-f="${id}">${l}</button>`).join('')}</div>`:'';
  const body=!loaded?`<div class="empty"><h3>Loading…</h3>Shared records are on their way.</div>`
    :!list.length?`<div class="empty"><h3>${opts.emptyTitle||'No cars yet'}</h3>${opts.emptyText||'Tap <b>Add Car</b> when you buy one.'}</div>`
    :!v.length?`<div class="empty"><h3>Nothing here</h3>No cars match this filter${search?' and search':''}.</div>`
    :v.map(carRow).join('');
  return `<section class="card"><div class="hd"><h2>${title}</h2><div style="display:flex;gap:10px;align-items:center">${opts.viewAll?`<button class="btn link" data-view="inventory">View All ${I(P.arrow,2.2)}</button>`:''}${canWrite?`<button class="btn primary sm" data-act="openAdd">${I(P.plus,2.6)}Add Car</button>`:''}</div></div>${chips}<div class="rows">${body}</div></section>`;
}
function greeting(){ const h=new Date().getHours(); return h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening'; }

function viewDashboard(){
  const active=cars.filter(c=>c.stage!=='done');
  const invested=active.reduce((a,c)=>a+(+c.purchase?.price||0),0);
  const potential=cars.reduce((a,c)=>a+Math.max(0,estProfit(c)),0);
  const booked=cars.filter(c=>stageIdx(c.stage)>=stageIdx('sold')).reduce((a,c)=>a+profitOf(c),0);
  const rcPend=cars.filter(c=>c.stage==='sold'||c.stage==='rc').length;
  const added7=cars.filter(c=>c.createdAt&&(Date.now()-new Date(c.createdAt))<7*86400000).length;

function salesChart(){
  const days=30, now=new Date(); now.setHours(0,0,0,0);
  const start=new Date(now); start.setDate(start.getDate()-(days-1));
  const sold=cars.filter(c=>c.sale?.price&&c.sale?.date);
  const daily=new Array(days).fill(0);
  sold.forEach(c=>{ const d=Math.floor((new Date(c.sale.date)-start)/86400000); if(d>=0&&d<days) daily[d]+=+c.sale.price; });
  const cum=[]; daily.reduce((a,v,i)=>(cum[i]=a+v),0);
  const total=cum[days-1]||0, count=sold.filter(c=>new Date(c.sale.date)>=start).length;
  const W=320,H=120,px=6,py=10; const max=Math.max(1,...cum);
  const pts=cum.map((v,i)=>[px+i*(W-2*px)/(days-1), H-py-(v/max)*(H-2*py)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-py} L${px} ${H-py} Z`;
  const lab=i=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
  return `<div style="margin-bottom:8px"><div class="num" style="font-size:24px;font-weight:800;letter-spacing:-.02em">${lakh(total)}</div><div class="hint">Total Sales · ${count} car${count===1?'':'s'}</div></div>
  <div class="chart" id="chart" data-cum="${cum.join(',')}" data-start="${start.toISOString()}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative sales over the last 30 days">
    ${[0.5,1].map(f=>`<line x1="${px}" x2="${W-px}" y1="${(H-py-f*(H-2*py)).toFixed(1)}" y2="${(H-py-f*(H-2*py)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join('')}
    <line x1="${px}" x2="${W-px}" y1="${H-py}" y2="${H-py}" stroke="var(--line-strong)"/>
    <path d="${area}" fill="var(--green)" opacity=".14"/><path d="${path}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[days-1][0].toFixed(1)}" cy="${pts[days-1][1].toFixed(1)}" r="4" fill="var(--green)" stroke="var(--surface)" stroke-width="2"/>
    <line id="xh" x1="0" x2="0" y1="${py}" y2="${H-py}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
    <circle id="xp" r="4" fill="var(--fg)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
  </svg><div class="tip" id="tip" hidden></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">${[0,10,20,29].map(i=>`<span>${lab(i)}</span>`).join('')}</div></div>`;
}

function wireChart(){
  const ch=$('#chart'); if(!ch) return; const svg=$('svg',ch), xh=$('#xh',ch), xp=$('#xp',ch), tip=$('#tip',ch);
  const cum=ch.dataset.cum.split(',').map(Number), start=new Date(ch.dataset.start), days=cum.length, W=320,H=120,px=6,py=10, max=Math.max(1,...cum);
  const move=e=>{ const r=svg.getBoundingClientRect(); const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W; const i=Math.max(0,Math.min(days-1,Math.round((x-px)/((W-2*px)/(days-1)))));
    const cx=px+i*(W-2*px)/(days-1), cy=H-py-(cum[i]/max)*(H-2*py); xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.setAttribute('opacity','.4'); xp.setAttribute('cx',cx); xp.setAttribute('cy',cy); xp.setAttribute('opacity','1');
    const d=new Date(start); d.setDate(d.getDate()+i); tip.hidden=false; tip.textContent=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+lakh(cum[i]); tip.style.left=(cx/W*r.width)+'px'; tip.style.top=(cy/H*r.height)+'px'; };
  const leave=()=>{ xh.setAttribute('opacity','0'); xp.setAttribute('opacity','0'); tip.hidden=true; };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('mouseleave',leave); svg.addEventListener('touchend',leave);
}

const busy=new Set();
async function write(id,patch,logText){
  if(!db) return toast('Not connected to shared records.'); if(busy.has(id)) return; busy.add(id);
  const c=cars.find(x=>x.id===id); const now=new Date().toISOString();
  const log=[{at:now,text:logText,by:myId||null},...(c?.log||[])].slice(0,200);
  try{ await db.collection('cars').doc(id).update({...patch,log,updatedAt:now,updatedBy:myId||null}); toast(logText); }catch(e){ handleErr(e); }finally{ busy.delete(id); }
}
function handleErr(e){ const code=e&&e.code;
  if(code==='permission-denied'||code==='invalid_argument'){ toast('Permission denied. Sign in as admin to update.'); }
  else if(code==='resource-exhausted'||code==='quota_exceeded') toast('Storage quota reached. Try again later.');
  else toast('Could not save. Check your connection and try again.'); console.error(e); }
async function createCar(){

  try{ const ref=await db.collection('cars').add(doc); closeOverlay(); toast('Car added. Now add photos.'); selectCar(ref.id); tab='photos'; renderPanel(); }catch(e){ handleErr(e); }
}
function shrink(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ URL.revokeObjectURL(url); const max=1280; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); const tryQ=q=>cv.toBlob(b=>{ if(!b) return rej(new Error('encode')); if(b.size>650000&&q>0.5) tryQ(q-0.1); else res(b); },'image/jpeg',q); tryQ(0.82); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); }; img.src=url; }); }
async function uploadPhotos(files){
  const c=sel(); if(!c||!assets||!files.length) return; uploading=true; renderPanel();
  const ids=[]; let failed=0;
  for(const f of files){ try{ let b=f; try{ b=await shrink(f);}catch(_){ } const r=await assets.upload(b,{type:b.type||'image/jpeg'}); ids.push(r.id); }catch(e){ failed++; console.error(e); if(e&&e.code==='quota_or_state'){ toast('Photo storage is full.'); break; } } }
  uploading=false;
  if(ids.length){ const cur=sel(); if(cur){ photoIdx=photos(cur).length; await write(cur.id,{photos:[...photos(cur),...ids]},ids.length+' photo'+(ids.length>1?'s':'')+' added'); } }
  if(failed) toast(failed+' photo'+(failed>1?'s':'')+' could not be uploaded.'); renderPanel();
}

  deletePhotoAsk(){ confirmKey='photo'; renderPanel(); },
  async deletePhotoYes(c){ const ph=photos(c); const id=ph[photoIdx]; if(!id) return; confirmKey=null; photoIdx=Math.max(0,photoIdx-1); await write(c.id,{photos:ph.filter(x=>x!==id)},'Photo removed'); if(assets){ try{ await assets.delete(id);}catch(e){ console.warn(e); } } },

async function apptAction(kind,id){
  const a=appts.find(x=>x.id===id); if(!a||!db) return;
  try{
    if(kind==='remove'){ await db.collection('appointments').doc(id).delete(); toast('Appointment removed'); return; }
    if(kind==='confirm'){ await db.collection('appointments').doc(id).update({status:'confirmed',updatedAt:new Date().toISOString()}); toast('Appointment confirmed'); return; }
    if(kind==='cancel'){ await db.collection('appointments').doc(id).update({status:'cancelled',updatedAt:new Date().toISOString()}); toast('Appointment cancelled'); return; }
    if(kind==='convert'){ const car=cars.find(c=>c.id===a.carId); if(!car) return toast('Car not found');
      await db.collection('appointments').doc(id).update({status:'converted',updatedAt:new Date().toISOString()});
      if(car.stage==='listed'){ await write(car.id,{stage:'customer',customer:{name:a.name,phone:a.phone||''}},`${a.name} visited (from appointment) and checked the car`); }
      else { await write(car.id,{},`${a.name} visited as per appointment`); }
      selectCar(car.id); toast('Moved to Customer Enquiry'); }
  }catch(e){ handleErr(e); }
}

    <div><h2>Admin sign in</h2><p>Sign in to manage cars, payments, RC transfers and appointments.</p></div>
    <label>Email<input id="l_email" type="email" autocomplete="username" placeholder="admin@revora.com" required></label>
    <label>Password<input id="l_pass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
    <div class="hint err" id="l_err" hidden>Email or password is incorrect.</div>
    <button class="btn primary" type="submit" id="l_btn">Sign in</button>
    <div class="foot">Just looking for a car? <button type="button" data-mode="store">Browse available cars</button></div>
  </form></div>`;
}
function renderMode(){
  $('#setup').hidden=mode!=='setup'; $('#login').hidden=mode!=='login'; $('#store').hidden=mode!=='store'; $('#adminApp').hidden=mode!=='admin';
  if(mode==='setup'){ $('#setup').innerHTML=`<div class="login"><div class="lcard"><div class="brand"><span class="mark">${I(P.car,2.2)}</span><div><b>Revora</b><small>Used Car Business</small></div></div><h2>Almost ready</h2><p>The app is deployed but not connected to its database yet. The Firebase configuration file is still empty.</p><p class="hint">Once the config is added, this page will show the car list automatically.</p></div></div>`; return; }
  if(mode==='login') renderLogin(); else if(mode==='store') renderStore(); else renderAll();
  window.scrollTo(0,0);
}
// ---------- customer storefront ----------
const forSale=()=>cars.filter(c=>c.stage==='listed'||c.stage==='customer').sort((a,b)=>String(b.listing?.date||'').localeCompare(String(a.listing?.date||'')));
function storeCard(c){ const ph=photos(c); const sp=[c.year,kmF(c.km),c.fuel,c.transmission].filter(Boolean).join(' · ');
  return `<button class="scard" data-ssel="${esc(c.id)}"><div class="img">${ph.length?`<img src="${blob(ph[0])}" alt="${esc(c.title)}" loading="lazy">`:I(P.car,1.4)}<span class="tag">Available</span>${ph.length>1?`<span class="n">${ph.length} photos</span>`:''}</div>
    <div class="b"><div class="pr num">${lakh(c.listing?.price)}</div><div class="tt">${esc(c.title)}</div><div class="sp">${esc(sp||'Details on request')}${c.owners?' · '+esc(c.owners):''}${c.city?' · '+esc(c.city):''}</div><div class="cta">View details & book a visit ${I(P.arrow,2.4)}</div></div></button>`; }
function renderStore(){
  const q=search.trim().toLowerCase(); const list=forSale().filter(c=>!q||[c.title,c.fuel,c.transmission,c.city,String(c.year)].some(v=>String(v||'').toLowerCase().includes(q)));
  const head=`<header class="shead"><div class="in"><button class="brand" data-ssel=""><span class="mark" aria-hidden="true">${I(P.car,2.2)}</span><div><b>Revora</b><small>Quality used cars</small></div></button>
    <div class="search" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="ssearch" type="search" placeholder="Search by model, fuel, year…" value="${esc(search)}" aria-label="Search cars"></div>
    <button class="admin" data-mode="login">Admin sign in</button></div></header>`;
  let body;
  const c=storeSel?cars.find(x=>x.id===storeSel):null;
  if(c){
    const ph=photos(c); if(storePh>=ph.length) storePh=Math.max(0,ph.length-1);
    const specs=[['Year',c.year],['Kms driven',kmF(c.km)],['Fuel',c.fuel],['Transmission',c.transmission],['Owner',c.owners],['Colour',c.colour],['Location',c.city]].filter(x=>x[1]);
    const soldOut=!(c.stage==='listed'||c.stage==='customer');
    const form=booked&&booked.carId===c.id?`<div class="ok-box"><span class="ic">${I(P.check,3)}</span><div><b>Visit booked</b><span>Thanks ${esc(booked.name)}. We will confirm your visit on ${esc(fmtApptDT(booked))} shortly${booked.phone?' on '+esc(booked.phone):''}.</span></div></div>`
      :bookFail&&bookFail.carId===c.id?`<div class="box"><h3>Almost there</h3><span class="hint">This link is view-only, so the booking could not be saved automatically. Copy the message below and send it to us, and we will confirm your visit.</span><div class="copybox" id="copyTxt">${esc(bookFail.text)}</div><div class="frow"><button class="btn primary sm" data-act="copyReq">Copy message</button><button class="btn sm" data-act="bookAgain">Edit request</button></div></div>`
      :`<form class="box" id="bookForm" style="border-left:3px solid var(--blue)"><h3>Book a visit to check this car</h3>
        <div class="form"><label>Your name<input id="b_name" required placeholder="Full name"></label><label>Phone<input id="b_phone" inputmode="tel" required placeholder="98xxxxxxxx"></label>
        <label>Date<input id="b_date" type="date" required min="${today()}" value="${today()}"></label><label>Time<input id="b_time" type="time" required value="11:00"></label>
        <label class="full">Anything to tell us? (optional)<input id="b_note" placeholder="e.g. I will bring my mechanic"></label></div>
        <button class="btn primary" type="submit" id="b_btn">${I(P.cal)}Book appointment</button><span class="hint">We will confirm the time with you. No payment needed to book.</span></form>`;
    body=`<div class="sbody"><button class="btn link" data-ssel="" style="align-self:flex-start">${I(P.l,2.4)} All cars</button>
      <div class="sdetail"><div class="sgal"><div class="main">${ph.length?`<img src="${blob(ph[storePh])}" alt="${esc(c.title)}" data-slb="${storePh}">${ph.length>1?`<button class="arr l" data-sph="-1" aria-label="Previous">${I(P.l,2.6)}</button><button class="arr r" data-sph="1" aria-label="Next">${I(P.r,2.6)}</button><span class="idx num">${storePh+1} / ${ph.length}</span>`:''}`:I(P.car,1.2)}</div>${ph.length>1?`<div class="th">${ph.map((id,i)=>`<button class="${i===storePh?'on':''}" data-sth="${i}" aria-label="Photo ${i+1}"><img src="${blob(id)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}</div>
      <div class="sinfo"><div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:10px"><div class="sprice num">${lakh(c.listing?.price)}<small>asking price</small></div><h2 style="font-size:20px">${esc(c.title)}${c.year?' <span class="muted" style="font-weight:500">'+esc(c.year)+'</span>':''}</h2>${c.reg?`<span class="regplate">${esc(c.reg.replace(/(\d{4})$/,'••••'))}</span>`:''}
        ${soldOut?'<span class="pill sold">Sold</span>':'<span class="pill listed">Available for viewing</span>'}
        <div class="specgrid">${specs.map(([k,v])=>`<div class="spec"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div></div>
        ${soldOut?'<div class="ro">This car has been sold. Browse the other cars we have available.</div>':form}</div></div></div>`;
  } else {
    body=`<div class="sbody"><div class="hero"><div><h1>Find your next car at Revora</h1><p>Hand-picked used cars, checked by us. Browse what is available, then book a time to come and see the car in person.</p></div><span class="pill">${list.length} car${list.length===1?'':'s'} available</span></div>
      ${!loaded?`<div class="empty"><h3>Loading cars…</h3></div>`:list.length?`<div class="sgrid">${list.map(storeCard).join('')}</div>`:`<div class="card empty"><h3>${q?'No cars match your search':'No cars listed right now'}</h3>${q?'Try a different model or fuel type.':'Please check back soon.'}</div>`}</div>`;
  }
  $('#store').innerHTML=head+body+`<div class="sfoot">© Revora · Used Car Business · <button data-mode="login">Admin</button></div>`;
}
async function bookVisit(){
  const c=cars.find(x=>x.id===storeSel); if(!c) return;
  const name=$('#b_name').value.trim(), phone=$('#b_phone').value.trim(), date=$('#b_date').value, time=$('#b_time').value, note=$('#b_note').value.trim();
  if(!name||!phone||!date||!time) return toast('Please fill your name, phone, date and time.');
  const a={carId:c.id,carTitle:[c.title,c.year,c.fuel].filter(Boolean).join(' '),name,phone,date,time,note,status:'new',createdAt:new Date().toISOString()};
  const btn=$('#b_btn'); if(btn){ btn.disabled=true; btn.textContent='Booking…'; }
  try{ if(!db) throw {code:'not_granted'}; await db.collection('appointments').add(a); booked=a; bookFail=null; }
  catch(e){ console.warn(e); bookFail={carId:c.id,text:`Hi Revora, I'm ${name} (${phone}). I'd like to visit and check the ${a.carTitle}${c.reg?' ('+c.reg+')':''} on ${fmtApptDT(a)}.${note?' Note: '+note:''}`}; }
  renderStore();
}
// ---------- events ----------
document.addEventListener('click',e=>{
  const sm=e.target.closest('[data-mode],[data-ssel],[data-sph],[data-sth],[data-slb],[data-appt]');
  if(sm){
    if(sm.dataset.mode){ mode=sm.dataset.mode; renderMode(); return; }
    if(sm.dataset.ssel!==undefined){ storeSel=sm.dataset.ssel||null; storePh=0; booked=null; bookFail=null; renderStore(); window.scrollTo(0,0); return; }
    if(sm.dataset.sph){ const n=photos(cars.find(x=>x.id===storeSel)||{}).length; storePh=(storePh+Number(sm.dataset.sph)+n)%n; renderStore(); return; }
    if(sm.dataset.sth!==undefined){ storePh=Number(sm.dataset.sth); renderStore(); return; }
    if(sm.dataset.slb!==undefined){ selId=storeSel; lbIdx=Number(sm.dataset.slb); renderLightbox(); return; }
    if(sm.dataset.appt){ apptAction(sm.dataset.appt,sm.dataset.id); return; }
  }
  const t=e.target.closest('[data-view],[data-f],[data-sel],[data-unsel],[data-stop],[data-tab],[data-ph],[data-thumb],[data-lb],[data-lbn],[data-lbclose],[data-close],[data-act]'); if(!t) return;
  const c=sel();
  if(t.dataset.view){ view=t.dataset.view; filter='all'; window.scrollTo(0,0); renderNav(); renderView(); return; }
  if(t.dataset.f!==undefined){ filter=(filter===t.dataset.f&&t.classList.contains('pstage'))?'all':t.dataset.f; renderView(); return; }
  if(t.dataset.sel){ selectCar(t.dataset.sel); return; }
  if(t.hasAttribute('data-unsel')){ if(narrow()){ sheetOpen=false; renderPanel(); } else unselect(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; confirmKey=null; renderPanel(); return; }
  if(t.dataset.ph){ const n=photos(c).length; photoIdx=(photoIdx+Number(t.dataset.ph)+n)%n; renderPanel(); return; }
  if(t.dataset.thumb!==undefined){ photoIdx=Number(t.dataset.thumb); renderPanel(); return; }
  if(t.hasAttribute('data-lbclose')){ lbIdx=-1; renderLightbox(); return; }
  if(t.dataset.lbn){ const n=photos(c).length; lbIdx=(lbIdx+Number(t.dataset.lbn)+n)%n; renderLightbox(); return; }
  if(t.dataset.lb!==undefined){ lbIdx=Number(t.dataset.lb); renderLightbox(); return; }
  if(t.hasAttribute('data-close')){ closeOverlay(); return; }
  if(t.hasAttribute('data-stop')) return;
  if(t.dataset.act==='copyReq'){ const txt=$('#copyTxt')?.textContent||''; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Message copied'),()=>toast('Select the text and copy it')); else toast('Select the text and copy it'); return; }
  if(t.dataset.act==='bookAgain'){ bookFail=null; renderStore(); return; }
  if(t.dataset.act){ const fn=actions[t.dataset.act]; if(fn) fn(c); }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='loginForm'){ e.preventDefault(); const em=$('#l_email').value.trim().toLowerCase(), pw=$('#l_pass').value; const btn=$('#l_btn'); btn.disabled=true; btn.textContent='Checking…';
    let ok=false, msg='Email or password is incorrect.';
    try{ const cred=await firebase.auth().signInWithEmailAndPassword(em,pw); ok=!!cred.user; }
    catch(err){ ok=false; if(err&&err.code==='auth/network-request-failed') msg='No internet connection. Try again.'; else if(err&&err.code==='auth/too-many-requests') msg='Too many attempts. Wait a few minutes and try again.'; else if(err&&err.code==='auth/operation-not-allowed') msg='Email sign-in is not enabled in Firebase yet.'; console.warn(err); }
    if(ok){ mode='admin'; view='dashboard'; document.body.classList.add('boot'); setTimeout(()=>document.body.classList.remove('boot'),2500); renderMode(); toast('Welcome back, admin'); }
    else { btn.disabled=false; btn.textContent='Sign in'; const er=$('#l_err'); er.hidden=false; er.textContent=msg; const card=$('.lcard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } return; }
  if(e.target.id==='bookForm'){ e.preventDefault(); bookVisit(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='ssearch'){ search=e.target.value; if(!storeSel){ const grid=$('#store .sgrid, #store .sbody .empty'); renderStore(); const inp=$('#ssearch'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); } } } });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('.row[data-sel]')){ selectCar(e.target.closest('.row').dataset.sel); }
  if(e.key==='Escape'){ if(lbIdx>=0){ lbIdx=-1; renderLightbox(); } else if(!$('#overlay').hidden) closeOverlay(); else if(sheetOpen&&narrow()){ sheetOpen=false; renderPanel(); } }
  if(lbIdx>=0&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){ const n=photos(sel()).length; if(n>1){ lbIdx=(lbIdx+(e.key==='ArrowRight'?1:-1)+n)%n; renderLightbox(); } }
  if(e.key==='Enter'&&e.target.id==='noteIn'){ const c=sel(); if(c) actions.note(c); }
});
document.addEventListener('change',e=>{ if(e.target.id==='f_mode'){ const w=$('#bankWrap',e.target.closest('.box')); if(w) w.hidden=e.target.value!=='loan'; } });
$('#fileIn').addEventListener('change',e=>{ const files=[...e.target.files].filter(f=>f.type.startsWith('image/')); if(files.length) uploadPhotos(files); });
let sx=null,sT=null;
document.addEventListener('touchstart',e=>{ const t=e.target.closest('#lbView,.panel .ph'); if(t){ sx=e.touches[0].clientX; sT=t.id==='lbView'?'lb':'ph'; } },{passive:true});
document.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)<40) return; const c=sel(); const n=c?photos(c).length:0; if(n<2) return; const d=dx<0?1:-1;
  if(sT==='lb'){ lbIdx=(lbIdx+d+n)%n; renderLightbox(); } else { photoIdx=(photoIdx+d+n)%n; renderPanel(); } },{passive:true});
$('#search').addEventListener('input',e=>{ search=e.target.value; renderView(); });
$('#bell').addEventListener('click',()=>{ view='dashboard'; renderNav(); renderView(); const el=document.querySelector('.pend'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); });
window.addEventListener('resize',()=>{ if(sheetOpen) renderPanel(); });
let toastT; function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }

// ---------- boot ----------
renderMe();
(function boot(){
  const cfg=window.REVORA_FIREBASE;
  if(!cfg||!cfg.apiKey||/YOUR_/.test(cfg.apiKey)){ mode='setup'; loaded=true; renderMode(); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ console.error(e); mode='setup'; renderMode(); return; }
  db=firebase.firestore(); db.settings({ignoreUndefinedProperties:true,merge:true});
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){}
  // photo storage shim: photos live in Firestore as compressed data URLs (free plan, no Cloud Storage needed)
  const toDataURL=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(b); });
  assets={
    async upload(b){ const data=await toDataURL(b); if(data.length>950000) throw {code:'too_large',message:'Photo too large'}; const ref=await db.collection('photos').add({data,size:b.size,createdAt:new Date().toISOString()}); const id='fs:'+ref.id; photoCache[id]=data; return {id,url:data,sizeBytes:b.size,contentType:b.type}; },
    async delete(id){ if(String(id).startsWith('fs:')){ await db.collection('photos').doc(String(id).slice(3)).delete(); delete photoCache[id]; } return {deleted:true}; }
  };
  user={ async id(){ const u=firebase.auth().currentUser; return u?u.uid:null; }, async profiles(ids){ const o={}; ids.forEach(i=>o[i]={name:'Admin'}); return o; } };
  let apptUnsub=null;
  firebase.auth().onAuthStateChanged(u=>{
    const isAdmin=!!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL);
    canWrite=isAdmin; myId=u?u.uid:null; me={name:isAdmin?'Admin':'',avatar:'',email:u?u.email||'':''}; renderMe();
    // appointments are readable only by the admin, so subscribe after sign-in and drop it on sign-out
    if(isAdmin&&!apptUnsub){ apptUnsub=db.collection('appointments').onSnapshot(snap=>{ appts=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()})); if(mode==='admin') renderAll(); },err=>{ console.error(err); apptUnsub=null; }); }
    if(!isAdmin&&apptUnsub){ apptUnsub(); apptUnsub=null; appts=[]; }
    if(!authReady){ authReady=true; mode=isAdmin?'admin':'store'; if(isAdmin){ document.body.classList.add('boot'); setTimeout(()=>document.body.classList.remove('boot'),2500); } renderMode(); }
    else if(!isAdmin&&mode==='admin'){ mode='store'; renderMode(); }
  });
  const timer=setTimeout(()=>setLive('err','Slow connection'),10000);
  db.collection('cars').onSnapshot(snap=>{
    cars=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()})); loaded=true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); setLive('on','Live'); }
    if(mode==='admin') renderAll(); else if(mode==='store') renderStore();
  },err=>{ clearTimeout(timer); loaded=true; setLive('err','Connection lost'); if(mode==='admin') renderAll(); else if(mode==='store') renderStore(); console.error(err); });
})();
})();
</script>
</body>
</html>
