html,body{margin:0}
/* Layout: dark sidebar (nav) | main column (greeting, KPI cards, pipeline strip, cars table, widgets row) | right panel (selected car). Sidebar becomes a bottom nav and the right panel a full-screen sheet on phones. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef1f6; --line:#e5e9f0; --line-strong:#cfd6e0;
  --fg:#0f172a; --fg-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --side:#ffffff; --side-2:#eef3ff; --side-fg:#0f172a; --side-muted:#5b6b85; --side-line:#e5e9f0;
  --blue:#2563eb; --blue-soft:#e3ecfd; --green:#16a34a; --green-soft:#dcf5e5; --orange:#f97316; --orange-soft:#ffecd9; --purple:#7c3aed; --purple-soft:#ece4fd; --red:#dc2626; --red-soft:#fde3e3; --teal:#0d9488; --teal-soft:#d9f3ef; --amber:#d97706; --amber-soft:#fdf0d5;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 6px rgba(15,23,42,.04); --shadow:0 10px 30px rgba(15,23,42,.12); --shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --r:14px; --r-sm:10px; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#121a2e; --surface-2:#172038; --surface-3:#1d2742; --line:#222c47; --line-strong:#34405f;
  --fg:#eef2fa; --fg-2:#c7d0e3; --muted:#8e9ab8; --faint:#5c688a;
  --side:#121a2e; --side-2:#1b2542; --side-fg:#eef2fa; --side-muted:#8e9ab8; --side-line:#222c47;
  --blue:#5b8cff; --blue-soft:#172a55; --green:#3ad17a; --green-soft:#0f3322; --orange:#ff954d; --orange-soft:#3d2410; --purple:#a98bff; --purple-soft:#2a1f4d; --red:#ff6b6b; --red-soft:#3f1a1a; --teal:#2fc4b4; --teal-soft:#0f3331; --amber:#f5b041; --amber-soft:#3a2a10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.8);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface-2:#172038; --surface-3:#1d2742; --line:#222c47; --line-strong:#34405f;
  --fg:#eef2fa; --fg-2:#c7d0e3; --muted:#8e9ab8; --faint:#5c688a;
  --side:#121a2e; --side-2:#1b2542; --side-fg:#eef2fa; --side-muted:#8e9ab8; --side-line:#222c47;
  --blue:#5b8cff; --blue-soft:#172a55; --green:#3ad17a; --green-soft:#0f3322; --orange:#ff954d; --orange-soft:#3d2410; --purple:#a98bff; --purple-soft:#2a1f4d; --red:#ff6b6b; --red-soft:#3f1a1a; --teal:#2fc4b4; --teal-soft:#0f3331; --amber:#f5b041; --amber-soft:#3a2a10;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.8);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
img{max-width:100%;display:block}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
#panelCol{display:none}
@media (max-width:760px){ .app{grid-template-columns:1fr} }

/* sidebar */
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;height:100dvh;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.brand .mark svg{width:24px;height:24px}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.1}
.brand small{font-size:11.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--side-muted);font-weight:600;font-size:14px;width:100%;transition:background .18s,color .18s,transform .18s}
.nav button:hover{transform:translateX(3px)}
.nav button:active{transform:translateX(3px) scale(.98)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--side-2);color:var(--side-fg)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.nav .n{margin-left:auto;font-size:11px;background:var(--side-2);color:var(--blue);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav button.on .n{background:rgba(255,255,255,.25)}
.side .spacer{flex:1}
.promo{background:linear-gradient(135deg,var(--side-2),var(--green-soft));border-radius:14px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.promo .em{font-size:26px}
.promo b{font-size:14px}
.promo small{font-size:12px;color:var(--side-muted)}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--side-line);margin-top:12px}
.me .iconbtn{color:var(--side-muted)}
.me .iconbtn:hover{color:var(--red);background:var(--red-soft)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.me b{display:block;font-size:14px}
.me small{font-size:12px;color:var(--side-muted)}
@media (max-width:760px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;border-top:1px solid var(--side-line);border-right:0;box-shadow:0 -4px 16px rgba(15,23,42,.06);gap:0;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand,.promo,.me,.side .spacer{display:none}
  .nav{flex-direction:row;gap:2px;width:100%;justify-content:space-between}
  .nav button{flex-direction:column;gap:4px;padding:8px 4px;font-size:10.5px;border-radius:10px;flex:1 1 0;width:auto;min-width:0;align-items:center;position:relative}
  .nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button:hover{transform:none}
  .nav button.sec{display:none}
  .side .nav .more{display:flex}
  .nav .n{display:block;position:absolute;top:4px;right:calc(50% - 22px);margin:0;min-width:16px;height:16px;line-height:16px;padding:0 4px;font-size:9.5px;background:var(--red);color:#fff}
  .nav button.on .n{background:#fff;color:var(--blue)}
}
.nav .more{display:none}
.splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg)}
.splash .mark{width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;animation:pulseLogo 1.2s ease-in-out infinite}
.splash .mark svg{width:32px;height:32px}
.splash b{font-size:18px;font-weight:800;letter-spacing:-.01em}
@keyframes pulseLogo{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(37,99,235,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(37,99,235,0)}}
.moremenu{display:flex;flex-direction:column;gap:4px}
.moremenu button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;font-weight:600;font-size:15px;color:var(--fg-2);width:100%}
.moremenu button:hover,.moremenu button.on{background:var(--blue-soft);color:var(--blue)}
.moremenu button svg{width:20px;height:20px}
.moremenu button.out{color:var(--red)}

/* main */
.main{min-width:0;padding:18px 24px 120px;display:flex;flex-direction:column;gap:22px;padding-right:max(24px,env(safe-area-inset-right,0px))}
#view{display:flex;flex-direction:column;gap:22px}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
body.boot .topbar,body.boot #view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
body.boot #view>*:nth-child(1){animation-delay:.05s} body.boot #view>*:nth-child(2){animation-delay:.12s} body.boot #view>*:nth-child(3){animation-delay:.19s} body.boot #view>*:nth-child(4){animation-delay:.26s} body.boot #view>*:nth-child(5){animation-delay:.33s}
body.boot .kpi{animation:pop .45s cubic-bezier(.2,.8,.2,1) both} body.boot .kpi:nth-child(2){animation-delay:.08s} body.boot .kpi:nth-child(3){animation-delay:.16s} body.boot .kpi:nth-child(4){animation-delay:.24s}
body.boot .nav button{animation:rise .4s both} body.boot .nav button:nth-child(2){animation-delay:.04s} body.boot .nav button:nth-child(3){animation-delay:.08s} body.boot .nav button:nth-child(4){animation-delay:.12s} body.boot .nav button:nth-child(5){animation-delay:.16s} body.boot .nav button:nth-child(6){animation-delay:.2s} body.boot .nav button:nth-child(7){animation-delay:.24s}
body.boot .pstage{animation:pop .4s both} body.boot .pstage:nth-of-type(2){animation-delay:.06s} body.boot .pstage:nth-of-type(3){animation-delay:.12s} body.boot .pstage:nth-of-type(4){animation-delay:.18s} body.boot .pstage:nth-of-type(5){animation-delay:.24s} body.boot .pstage:nth-of-type(6){animation-delay:.3s} body.boot .pstage:nth-of-type(7){animation-delay:.36s}
.row{animation:rise .3s cubic-bezier(.2,.8,.2,1) both} .row:nth-child(2){animation-delay:.04s} .row:nth-child(3){animation-delay:.08s} .row:nth-child(4){animation-delay:.12s} .row:nth-child(5){animation-delay:.16s} .row:nth-child(n+6){animation-delay:.2s}
.pbody,.pempty{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.panel .ph img{animation:pop .35s both}
.chart path[stroke]{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s .3s ease-out forwards}
.toast{animation:rise .25s both}
.modal{animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
.sheetwrap .panel{animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){ .main{padding:12px max(14px,env(safe-area-inset-right,0px)) 110px max(14px,env(safe-area-inset-left,0px));gap:16px} #view{gap:16px} }
.topbar{display:flex;align-items:center;gap:12px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;box-shadow:var(--shadow-sm);min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:0;height:100%;box-shadow:none}
.search input:focus{box-shadow:none}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);animation:livep 2s infinite}
@keyframes livep{0%,100%{box-shadow:0 0 0 3px var(--green-soft)}50%{box-shadow:0 0 0 6px var(--green-soft)}}
.live.err .dot{background:var(--red)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow-sm);color:var(--fg-2);flex:none;transition:transform .2s,box-shadow .2s}
.bell:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.bell:hover svg{animation:swing .6s ease-in-out}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.bell svg{width:19px;height:19px}
.bell .b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.topbar .avatar{width:42px;height:42px}
@media (max-width:760px){ .topbar .avatar{display:none} .live span.t{display:none} .live{padding:0 12px} #topOut{display:grid!important} }
.brandm{display:none;align-items:center;gap:8px;font-weight:800;font-size:16px}
.brandm .mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brandm .mark svg{width:20px;height:20px}
@media (max-width:760px){ .brandm{display:flex} }

.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:26px;font-weight:800}
.greet p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
@media (max-width:760px){ .greet h1{font-size:21px} }
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .18s,transform .15s,box-shadow .18s,filter .18s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.10)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn svg{transition:transform .2s}
.btn:hover svg:last-child{transform:translateX(2px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{background:var(--red-soft);border-color:transparent;color:var(--red);box-shadow:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:none;box-shadow:none;color:var(--blue);padding:0;font-weight:600}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1000px){ .kpis{grid-template-columns:repeat(2,1fr)!important} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-sm);min-width:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--blue-soft)}
.kpi .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.kpi:hover .ic{transform:scale(1.1) rotate(-4deg)}
.kpi .ic svg{width:24px;height:24px}
.kpi .ic.blue{background:var(--blue-soft);color:var(--blue)} .kpi .ic.green{background:var(--green-soft);color:var(--green)} .kpi .ic.orange{background:var(--orange-soft);color:var(--orange)} .kpi .ic.purple{background:var(--purple-soft);color:var(--purple)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.delta{font-size:11.5px;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:2px}
.delta.neg{color:var(--red)}
@media (max-width:760px){ .kpi{padding:12px 14px;gap:10px} .kpi .ic{width:42px;height:42px;border-radius:12px} .kpi .v{font-size:18px} }

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);min-width:0;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:0 6px 24px rgba(15,23,42,.08)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card .hd h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .bd{padding:16px 20px 20px}

/* pipeline */
.pipe{display:flex;align-items:flex-start;gap:4px;overflow-x:auto;padding:14px 18px 20px;scrollbar-width:none}
.pipe::-webkit-scrollbar{display:none}
.pstage{flex:1 0 96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;padding:8px 4px;border-radius:12px;transition:background .18s,transform .18s}
.pstage:hover{background:var(--surface-2);transform:translateY(-2px)}
.pstage.on{background:var(--surface-3)}
.pstage .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pstage:hover .ic{transform:scale(1.15);box-shadow:0 6px 14px rgba(15,23,42,.12)}
.pstage.on .ic{box-shadow:0 0 0 4px var(--surface),0 0 0 6px currentColor}
.pstage .ic svg{width:20px;height:20px}
.pstage b{font-size:13px;font-weight:700;color:var(--fg-2);line-height:1.2}
.pstage small{font-size:12px;color:var(--muted)}
.parrow{flex:0 0 28px;align-self:flex-start;margin-top:14px;color:var(--faint)}
.parrow svg{width:28px;height:28px}
.c-blue{background:var(--blue-soft);color:var(--blue)} .c-green{background:var(--green-soft);color:var(--green)} .c-orange{background:var(--orange-soft);color:var(--orange)} .c-purple{background:var(--purple-soft);color:var(--purple)} .c-teal{background:var(--teal-soft);color:var(--teal)} .c-red{background:var(--red-soft);color:var(--red)} .c-amber{background:var(--amber-soft);color:var(--amber)} .c-gray{background:var(--surface-3);color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;transition:background .18s,color .18s,transform .15s,border-color .18s}
.chip:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* car rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px minmax(160px,1.4fr) minmax(120px,1fr) minmax(220px,1.3fr) auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .18s,box-shadow .18s;position:relative}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--blue);transform:scaleY(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.row:hover{background:var(--surface-2)}
.row:hover::before,.row.sel::before{transform:scaleY(1)}
.row.sel{background:var(--blue-soft)}
.row:hover .act .btn{background:var(--blue);color:#fff;border-color:var(--blue)}
.thumb{width:92px;height:66px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.row:hover .thumb img{transform:scale(1.08)}
.thumb svg{width:30px;height:30px}
.row .t{min-width:0}
.row .t b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t .reg{font-size:12.5px;color:var(--fg-2);font-weight:500;margin-top:1px}
.row .t .pr{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--muted);transition:transform .18s}
.row:hover .pill{transform:translateX(2px)}
.pill.listed{background:var(--green-soft);color:var(--green)} .pill.customer{background:var(--purple-soft);color:var(--purple)} .pill.payment{background:var(--orange-soft);color:var(--orange)} .pill.sold{background:var(--blue-soft);color:var(--blue)} .pill.rc{background:var(--teal-soft);color:var(--teal)} .pill.done{background:var(--green-soft);color:var(--green)} .pill.purchased{background:var(--surface-3);color:var(--fg-2)} .pill.fail{background:var(--red-soft);color:var(--red)}
.row .sub{font-size:12px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;align-items:flex-start;min-width:0}
.mini .s{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);flex:1;min-width:0;position:relative}
.mini .s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mini .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;transition:transform .2s,box-shadow .2s}
.mini .s.now .d{box-shadow:0 0 0 0 rgba(37,99,235,.4);animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}70%{box-shadow:0 0 0 7px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.row:hover .mini .d{transform:scale(1.12)}
.mini .d svg{width:10px;height:10px}
.mini .s.done .d{background:var(--green);border-color:var(--green);color:#fff}
.mini .s.now .d{background:var(--blue);border-color:var(--blue);color:#fff}
.mini .s.done,.mini .s.now{color:var(--fg-2);font-weight:600}
.mini .s:not(:last-child)::after{content:"";position:absolute;top:8px;left:50%;width:100%;height:2px;background:var(--line-strong)}
.mini .s.done:not(:last-child)::after{background:var(--green)}
.row .act{display:flex;align-items:center;gap:6px}
@media (max-width:1000px){ .row{grid-template-columns:72px minmax(0,1fr) auto} .row .mini,.row .act{display:none} .thumb{width:72px;height:54px} }
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:16px;margin-bottom:4px}

/* widgets row */
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
@media (max-width:1000px){ .widgets{grid-template-columns:1fr!important} }
.feed{display:flex;flex-direction:column;gap:12px}
.feed .f{display:flex;gap:10px;align-items:flex-start}
.feed .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.feed b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.feed small{color:var(--muted);font-size:12px}
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.tip{position:absolute;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap}
.pend{display:flex;flex-direction:column;gap:10px}
.pend .p{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;transition:transform .2s,box-shadow .2s,border-color .2s}
.pend .p:hover{transform:translateX(3px);box-shadow:var(--shadow-sm);border-color:var(--line-strong)}
.feed .f{transition:transform .2s;border-radius:10px;padding:4px 6px;margin:-4px -6px}
.feed .f:hover{transform:translateX(3px);background:var(--surface-2)}
.pend .p .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.pend .p .ic svg{width:18px;height:18px}
.pend .p b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend .p small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend .p .tx{flex:1;min-width:0}
.cnt{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}

/* ---- right panel ---- */
.panel{background:var(--surface);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px)}
.panel .ph{position:relative;aspect-ratio:16/10;background:var(--surface-3);overflow:hidden;margin:12px;border-radius:12px;flex:none}
.panel .ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.panel .ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);text-align:center;font-size:12.5px;padding:10px}
.panel .ph .none svg{width:40px;height:40px;margin:0 auto 6px}
.panel .ph .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#0f172a;display:grid;place-items:center}
.panel .ph .x svg{width:16px;height:16px}
.panel .ph .arr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);color:#0f172a;display:grid;place-items:center;opacity:0;transition:opacity .2s,transform .2s}
.panel .ph:hover .arr{opacity:1}
.panel .ph .arr:hover{transform:translateY(-50%) scale(1.12)}
@media (hover:none){ .panel .ph .arr{opacity:1} }
.panel .ph .arr.l{left:8px}.panel .ph .arr.r{right:8px}
.panel .ph .arr svg{width:16px;height:16px}
.panel .ph .idx{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.phead{padding:4px 16px 0;display:flex;flex-direction:column;gap:6px}
.phead .summary{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.phead .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phead h2{font-size:17px;font-weight:800}
.phead .reg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg-2)}
.phead .reg button{color:var(--muted);display:grid}
.phead .reg svg{width:14px;height:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;margin-top:8px}
.tabs button{padding:10px 10px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .18s,border-color .18s}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.pbody{padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prices .k{font-size:12px;color:var(--muted)} .prices .v{font-size:17px;font-weight:800;letter-spacing:-.02em}
.prices .v.g{color:var(--green)} .prices .v.r{color:var(--red)}
.stagebox{background:var(--blue-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.stagebox .it{display:flex;gap:10px;align-items:flex-start}
.stagebox .it .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--blue)}
.stagebox .it .ic.g{color:var(--green)}
.stagebox .it .ic svg{width:13px;height:13px}
.stagebox small{display:block;font-size:11.5px;color:var(--muted)}
.stagebox b{display:block;font-size:13.5px}
.stagebox .sub{font-size:12px;color:var(--fg-2)}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow>.btn{flex:1 1 140px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.err{color:var(--red);font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,box-shadow .2s}
.box:hover{border-color:var(--line-strong)}
.box h3{font-size:14px;font-weight:700}
.box h3.cap{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details summary{list-style:none;cursor:pointer;font-weight:600;color:var(--blue);font-size:13px}
details summary::-webkit-details-marker{display:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:13px}
.kv .k{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:600;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column}
.tl .e{display:grid;grid-template-columns:22px 1fr;gap:8px;position:relative;padding-bottom:14px}
.tl .e:last-child{padding-bottom:0}
.tl .e::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl .e:last-child::before{display:none}
.tl .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:#fff;z-index:1}
.tl .d svg{width:11px;height:11px}
.tl .e.g .d{background:var(--green);border-color:var(--green)}
.tl .e.b .d{border-color:var(--blue)}
.tl b{display:block;font-size:13px;font-weight:600}
.tl small{color:var(--muted);font-size:11.5px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid button{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-3);position:relative;border:2px solid transparent;transition:transform .2s,box-shadow .2s,border-color .2s}
.pgrid button:hover{transform:scale(1.04);box-shadow:var(--shadow-sm)}
.pgrid button.on{border-color:var(--blue)}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid .add{display:grid;place-items:center;color:var(--muted);font-size:11.5px;font-weight:600;border:2px dashed var(--line-strong)!important;text-align:center}
.pgrid .add svg{width:18px;height:18px;margin:0 auto 2px}
.pgrid .cov{position:absolute;left:4px;top:4px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px}
.attempt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:8px 10px;background:var(--red-soft);color:var(--red);border-radius:8px}
/* leads (interested customers) */
.lead{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s;animation:rise .25s both}
.lead:hover{border-color:var(--line-strong)}
.lead.primary{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.lead.closed{opacity:.6}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lead .top>div:first-child{min-width:0;flex:1}
.lead .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lead .nm{font-weight:700;font-size:14px}
.lead .phn{font-size:12.5px;color:var(--muted)}
.lead .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.lead .tag{background:var(--surface-2);color:var(--fg-2);border-radius:6px;padding:2px 8px;font-weight:600}
.lead .tag.cash{background:var(--green-soft);color:var(--green)} .lead .tag.loan{background:var(--blue-soft);color:var(--blue)} .lead .tag.rej{background:var(--red-soft);color:var(--red)} .lead .tag.appr{background:var(--green-soft);color:var(--green)} .lead .tag.late{background:var(--red-soft);color:var(--red)} .lead .tag.soon{background:var(--amber-soft);color:var(--amber)}
.chance{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:84px}
.chance b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.chance small{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.chance .bar{width:84px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.chance .bar i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.hot{color:var(--green)} .warm{color:var(--amber)} .cold{color:var(--muted)} .won{color:var(--green)} .lost{color:var(--red)}
.chance.hot .bar i{background:var(--green)} .chance.warm .bar i{background:var(--amber)} .chance.cold .bar i{background:var(--faint)} .chance.won .bar i{background:var(--green)} .chance.lost .bar i{background:var(--red)}
.lead .why{font-size:12px;color:var(--muted)}
.lead .acts{display:flex;gap:6px;flex-wrap:wrap}
.lead .acts .btn{flex:0 0 auto}
.lead .edit{border-top:1px dashed var(--line);padding-top:10px}
.leadsum{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.leadsum b{color:var(--fg)}
.minichance{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.minichance i{width:36px;height:5px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden;display:inline-block}
.minichance i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:currentColor;border-radius:3px}
.ro{background:var(--amber-soft);color:var(--amber);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.pempty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;margin:auto}
.pempty svg{width:48px;height:48px;color:var(--faint)}
.banner{margin:12px;border-radius:14px;background:linear-gradient(135deg,var(--blue-soft),var(--green-soft));padding:16px;position:relative;overflow:hidden}
.banner b{font-size:15px;display:block} .banner small{color:var(--fg-2);font-size:12.5px}
.banner .ok{position:absolute;right:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.banner .ok svg{width:15px;height:15px}
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:flex-end;animation:fade .15s}
.sheetwrap .panel{width:100%;height:100%;position:relative;border-left:0;box-shadow:var(--shadow-lg);padding-top:env(safe-area-inset-top,0px)}
.ptop{display:flex;flex-direction:column}
@media (min-width:761px){
  .sheetwrap{align-items:center;justify-content:center;padding:24px}
  .sheetwrap .panel{width:min(1180px,100%);height:min(92vh,100%);border-radius:22px;padding-top:0;animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
  .ptop{display:grid;grid-template-columns:minmax(360px,44%) 1fr;gap:0 20px;align-items:start;padding:16px 20px 0}
  .ptop .ph{margin:0;aspect-ratio:16/10}
  .ptop .phead{padding:6px 0 0}
  .ptop .phead h2{font-size:24px}
  .ptop .phead .tools{margin-top:10px}
  .ptop .tabs{grid-column:1/-1;padding:0;margin-top:16px}
  .ptop .summary{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .ptop .prices{grid-template-columns:repeat(4,1fr)}
  .pbody{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;grid-auto-flow:dense;padding:18px 20px 28px}
  .pbody>.box{min-width:0}
  .pgrid{grid-template-columns:repeat(4,1fr)}
  .docs{grid-template-columns:repeat(3,1fr)}
  .pbody.single{grid-template-columns:1fr}
}
@keyframes fade{from{opacity:0}}

/* tables */
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:var(--surface-2)}
.table tr.clk{cursor:pointer}
.tscroll{overflow-x:auto}

/* lightbox + modal + toast */
.lb{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.92);display:flex;flex-direction:column;color:#fff;animation:fade .15s}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-size:14px;font-weight:600}
.lb .top button{color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.lb .top svg{width:22px;height:22px}
.lb .view{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.lb .view img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lb .arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.lb .arrow.l{left:12px}.lb .arrow.r{right:12px}
.lb .arrow svg{width:24px;height:24px}
.lb .dots{display:flex;gap:6px;justify-content:center;padding:14px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.lb .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.lb .dots i.on{background:#fff}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:65;display:grid;place-items:end center;animation:fade .15s}
@media (min-width:641px){ .scrim{place-items:center} }
.modal{background:var(--surface);width:min(580px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
@media (min-width:641px){ .modal{border-radius:16px} }
.modal h2{font-size:18px;font-weight:800}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface-3)}
.iconbtn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---- login ---- */

  else if(l.mode==='loan'){ if(l.loanStatus==='approved'){ p+=20; why.push('Loan approved'); } else if(l.loanStatus==='rejected'){ p=Math.min(p,15); why.push('Loan rejected'); } else { p+=0; why.push('Loan applied, awaiting bank'); } }

function salesChart(){
  const days=30, now=new Date(); now.setHours(0,0,0,0);
  const start=new Date(now); start.setDate(start.getDate()-(days-1));
  const sold=cars.filter(c=>c.sale?.price&&c.sale?.date);
  const daily=new Array(days).fill(0);
  sold.forEach(c=>{ const d=Math.floor((new Date(c.sale.date)-start)/86400000); if(d>=0&&d<days) daily[d]+=+c.sale.price; });
  const cum=[]; daily.reduce((a,v,i)=>(cum[i]=a+v),0);
  const total=cum[days-1]||0, count=sold.filter(c=>new Date(c.sale.date)>=start).length;
  const W=320,H=120,px=6,py=10; const max=Math.max(1,...cum);
  const pts=cum.map((v,i)=>[px+i*(W-2*px)/(days-1), H-py-(v/max)*(H-2*py)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-py} L${px} ${H-py} Z`;
  const lab=i=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
  return `<div style="margin-bottom:8px"><div class="num" style="font-size:24px;font-weight:800;letter-spacing:-.02em">${lakh(total)}</div><div class="hint">Total Sales · ${count} car${count===1?'':'s'}</div></div>
  <div class="chart" id="chart" data-cum="${cum.join(',')}" data-start="${start.toISOString()}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative sales over the last 30 days">
    ${[0.5,1].map(f=>`<line x1="${px}" x2="${W-px}" y1="${(H-py-f*(H-2*py)).toFixed(1)}" y2="${(H-py-f*(H-2*py)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>`).join('')}
    <line x1="${px}" x2="${W-px}" y1="${H-py}" y2="${H-py}" stroke="var(--line-strong)"/>
    <path d="${area}" fill="var(--green)" opacity=".14"/><path d="${path}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[days-1][0].toFixed(1)}" cy="${pts[days-1][1].toFixed(1)}" r="4" fill="var(--green)" stroke="var(--surface)" stroke-width="2"/>
    <line id="xh" x1="0" x2="0" y1="${py}" y2="${H-py}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
    <circle id="xp" r="4" fill="var(--fg)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
  </svg><div class="tip" id="tip" hidden></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">${[0,10,20,29].map(i=>`<span>${lab(i)}</span>`).join('')}</div></div>`;
}

function wireChart(){
  const ch=$('#chart'); if(!ch) return; const svg=$('svg',ch), xh=$('#xh',ch), xp=$('#xp',ch), tip=$('#tip',ch);
  const cum=ch.dataset.cum.split(',').map(Number), start=new Date(ch.dataset.start), days=cum.length, W=320,H=120,px=6,py=10, max=Math.max(1,...cum);
  const move=e=>{ const r=svg.getBoundingClientRect(); const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W; const i=Math.max(0,Math.min(days-1,Math.round((x-px)/((W-2*px)/(days-1)))));
    const cx=px+i*(W-2*px)/(days-1), cy=H-py-(cum[i]/max)*(H-2*py); xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.setAttribute('opacity','.4'); xp.setAttribute('cx',cx); xp.setAttribute('cy',cy); xp.setAttribute('opacity','1');
    const d=new Date(start); d.setDate(d.getDate()+i); tip.hidden=false; tip.textContent=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+lakh(cum[i]); tip.style.left=(cx/W*r.width)+'px'; tip.style.top=(cy/H*r.height)+'px'; };
  const leave=()=>{ xh.setAttribute('opacity','0'); xp.setAttribute('opacity','0'); tip.hidden=true; };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('mouseleave',leave); svg.addEventListener('touchend',leave);
}

const busy=new Set();
async function write(id,patch,logText){
  if(!db) return toast('Not connected to shared records.'); if(busy.has(id)) return; busy.add(id);
  const c=cars.find(x=>x.id===id); const now=new Date().toISOString();
  const log=[{at:now,text:logText,by:myId||null},...(c?.log||[])].slice(0,200);
  try{ await db.collection('cars').doc(id).update({...patch,log,updatedAt:now,updatedBy:myId||null}); toast(logText); }catch(e){ handleErr(e); }finally{ busy.delete(id); }
}
function handleErr(e){ const code=e&&e.code;
  if(code==='permission-denied'||code==='invalid_argument'){ toast('Permission denied. Sign in as admin to update.'); }
  else if(code==='resource-exhausted'||code==='quota_exceeded') toast('Storage quota reached. Try again later.');
  else toast('Could not save. Check your connection and try again.'); console.error(e); }

function shrink(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ URL.revokeObjectURL(url); const max=1280; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); const tryQ=q=>cv.toBlob(b=>{ if(!b) return rej(new Error('encode')); if(b.size>650000&&q>0.5) tryQ(q-0.1); else res(b); },'image/jpeg',q); tryQ(0.82); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); }; img.src=url; }); }
async function uploadPhotos(files){
  const c=sel(); if(!c||!assets||!files.length) return; uploading=true; renderPanel();
  const ids=[]; let failed=0;
  for(const f of files){ try{ let b=f; try{ b=await shrink(f);}catch(_){ } const r=await assets.upload(b,{type:b.type||'image/jpeg'}); ids.push(r.id); }catch(e){ failed++; console.error(e); if(e&&e.code==='quota_or_state'){ toast('Photo storage is full.'); break; } } }
  uploading=false;
  if(ids.length){ const cur=sel(); if(cur){ photoIdx=photos(cur).length; await write(cur.id,{photos:[...photos(cur),...ids]},ids.length+' photo'+(ids.length>1?'s':'')+' added'); } }
  if(failed) toast(failed+' photo'+(failed>1?'s':'')+' could not be uploaded.'); renderPanel();
}
async function uploadDoc(f,meta){
  const c=sel(); if(!c||!assets) return; uploading=true; renderPanel();
  try{ let b=f, mime=f.type||'application/octet-stream'; if(f.type.startsWith('image/')){ try{ b=await shrink(f); mime='image/jpeg'; }catch(_){} }
    else if(f.type==='application/pdf'){ if(f.size>700000) throw {code:'too_large'}; } else throw {code:'unsupported_type'};
    const r=await assets.upload(b,{type:mime}); const d={id:uid(),type:meta.type||'Other',expiry:meta.expiry||'',note:meta.note||'',fileId:r.id,mime,addedAt:new Date().toISOString()};
    uploading=false; addingDoc=false; await write(c.id,{docs:[...docsOf(c),d]},`Document added: ${d.type}${d.expiry?' · valid till '+fmtDate(d.expiry):''}`); }
  catch(e){ uploading=false; console.error(e); toast(e&&e.code==='too_large'?'File too large. Keep PDFs under 700 KB.':e&&e.code==='unsupported_type'?'Only photos and PDF files are supported.':'Could not upload the document.'); renderPanel(); }
}

async function apptAction(kind,id){
  const a=appts.find(x=>x.id===id); if(!a||!db) return;
  try{
    if(kind==='remove'){ await db.collection('appointments').doc(id).delete(); toast('Appointment removed'); return; }
    if(kind==='confirm'){ await db.collection('appointments').doc(id).update({status:'confirmed',updatedAt:new Date().toISOString()}); toast('Appointment confirmed'); return; }
    if(kind==='cancel'){ await db.collection('appointments').doc(id).update({status:'cancelled',updatedAt:new Date().toISOString()}); toast('Appointment cancelled'); return; }
    if(kind==='convert'){ const car=cars.find(c=>c.id===a.carId); if(!car) return toast('Car not found');
      await db.collection('appointments').doc(id).update({status:'converted',updatedAt:new Date().toISOString()});
      const now=new Date().toISOString(); const existing=leadsOf(car).find(l=>l.name.toLowerCase()===a.name.toLowerCase()&&l.status!=='lost'&&l.status!=='won');
      const leads=existing?leadsOf(car).map(l=>l===existing?{...l,lastContact:now}:l):[...leadsOf(car),{id:uid(),name:a.name,phone:a.phone||'',status:'enquired',mode:null,bank:'',loanStatus:null,offer:null,expectedBy:'',note:a.note||'',createdAt:now,lastContact:now,source:'appointment'}];
      const patch={leads}; if(car.stage==='listed'){ patch.stage='customer'; patch.customer={name:a.name,phone:a.phone||''}; }
      await write(car.id,patch,`${a.name} visited (from appointment) and checked the car`);
      selectCar(car.id); toast('Moved to Customer Enquiry'); }
  }catch(e){ handleErr(e); }
}

function emiCalc(price){
  const rate=+settings.interestRate||9.5; const down=emiDown==null?Math.round(price*0.2):Math.min(price,Math.max(0,emiDown)); const P0=Math.max(0,price-down); const r=rate/1200; const n=emiMonths||60;
  const emi=P0>0?(r?Math.round(P0*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):Math.round(P0/n)):0; return {down,P0,emi,n,rate,total:emi*n};
}

  const btn=cb?$('#cb_btn'):$('#b_btn'); if(btn){ btn.disabled=true; btn.textContent=cb?'Sending…':'Booking…'; }
  try{ if(!db) throw {code:'not_granted'}; await db.collection('appointments').add(a); booked=a; bookFail=null; }
  catch(e){ console.warn(e); bookFail={carId:c.id,text:cb?`Hi Revora, I'm ${name} (${phone}). Please call me back about the ${a.carTitle}.${note?' '+note:''}`:`Hi Revora, I'm ${name} (${phone}). I'd like to visit and check the ${a.carTitle}${c.reg?' ('+c.reg+')':''} on ${fmtApptDT(a)}.${note?' Note: '+note:''}`}; }
  renderStore();
}
function syncHash(){ const want=storeSel?'#car-'+storeSel:''; if(location.hash!==want){ try{ history.replaceState(null,'',location.pathname+location.search+want); }catch(_){} } }
function readHash(){ const m=location.hash.match(/^#car-([A-Za-z0-9_-]+)$/); return m?m[1]:null; }
// ---------- events ----------// ---------- events ----------
document.addEventListener('click',e=>{
  const sm=e.target.closest('[data-mode],[data-ssel],[data-sph],[data-sth],[data-slb],[data-appt],[data-stab]');
  if(sm){
    if(sm.dataset.mode){ mode=sm.dataset.mode; renderMode(); return; }
    if(sm.dataset.ssel!==undefined){ storeSel=sm.dataset.ssel||null; storePh=0; booked=null; bookFail=null; emiDown=null; storeTab='visit'; syncHash(); renderStore(); window.scrollTo(0,0); return; }
    if(sm.dataset.stab){ storeTab=sm.dataset.stab; renderStore(); return; }
    if(sm.dataset.sph){ const n=photos(cars.find(x=>x.id===storeSel)||{}).length; storePh=(storePh+Number(sm.dataset.sph)+n)%n; renderStore(); return; }
    if(sm.dataset.sth!==undefined){ storePh=Number(sm.dataset.sth); renderStore(); return; }
    if(sm.dataset.slb!==undefined){ selId=storeSel; lbIdx=Number(sm.dataset.slb); renderLightbox(); return; }
    if(sm.dataset.appt){ apptAction(sm.dataset.appt,sm.dataset.id); return; }
  }
  const t=e.target.closest('[data-view],[data-f],[data-sel],[data-unsel],[data-stop],[data-tab],[data-ph],[data-thumb],[data-lb],[data-lbn],[data-lbclose],[data-close],[data-lact],[data-exp],[data-pay],[data-docopen],[data-docdel],[data-fu],[data-buyerdel],[data-act]'); if(!t) return;
  const c=sel();
  if(t.dataset.view){ view=t.dataset.view; filter='all'; closeOverlay(); window.scrollTo(0,0); renderNav(); renderView(); return; }
  if(t.dataset.f!==undefined){ filter=(filter===t.dataset.f&&t.classList.contains('pstage'))?'all':t.dataset.f; renderView(); return; }
  if(t.dataset.sel){ selectCar(t.dataset.sel); return; }
  if(t.hasAttribute('data-unsel')){ unselect(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; confirmKey=null; renderPanel(); return; }
  if(t.dataset.ph){ const n=photos(c).length; photoIdx=(photoIdx+Number(t.dataset.ph)+n)%n; renderPanel(); return; }
  if(t.dataset.thumb!==undefined){ photoIdx=Number(t.dataset.thumb); renderPanel(); return; }
  if(t.hasAttribute('data-lbclose')){ lbIdx=-1; lbDoc=null; renderLightbox(); return; }
  if(t.dataset.lbn){ const n=photos(c).length; lbIdx=(lbIdx+Number(t.dataset.lbn)+n)%n; renderLightbox(); return; }
  if(t.dataset.lb!==undefined){ lbIdx=Number(t.dataset.lb); renderLightbox(); return; }
  if(t.dataset.lact){ const fn=actions['lead'+t.dataset.lact[0].toUpperCase()+t.dataset.lact.slice(1)]; if(fn&&c) fn(c,t.dataset.lead); return; }
  if(t.dataset.exp){ if(c) actions.expDel(c,t.dataset.exp); return; }
  if(t.dataset.pay){ if(c) actions.payDel(c,t.dataset.pay); return; }
  if(t.dataset.docopen){ if(c) actions.docOpen(c,t.dataset.docopen); return; }
  if(t.dataset.docdel){ if(c) actions.docDel(c,t.dataset.docdel); return; }
  if(t.dataset.fu){ const [cid,lid,what]=t.dataset.fu.split('|'); const car=cars.find(x=>x.id===cid); if(car) actions[what==='snooze'?'fuSnooze':'fuDone'](car,lid); return; }
  if(t.dataset.buyerdel){ actions.buyerDel(t.dataset.buyerdel); return; }
  if(t.hasAttribute('data-close')){ closeOverlay(); return; }
  if(t.hasAttribute('data-stop')) return;
  if(t.dataset.act==='copyReq'){ const txt=$('#copyTxt')?.textContent||''; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Message copied'),()=>toast('Select the text and copy it')); else toast('Select the text and copy it'); return; }
  if(t.dataset.act==='bookAgain'){ bookFail=null; renderStore(); return; }
  if(t.dataset.act==='copyStoreLink'){ const c=cars.find(x=>x.id===storeSel); const u=c?carLink(c):location.href; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>toast(u)); else toast(u); return; }
  if(t.dataset.act){ const fn=actions[t.dataset.act]; if(fn) fn(c,t.dataset.id); }
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='loginForm'){ e.preventDefault(); const em=$('#l_email').value.trim().toLowerCase(), pw=$('#l_pass').value; const btn=$('#l_btn'); btn.disabled=true; btn.textContent='Checking…';
    let ok=false, msg='Email or password is incorrect.';
    try{ const cred=await firebase.auth().signInWithEmailAndPassword(em,pw); ok=!!cred.user; }
    catch(err){ ok=false; if(err&&err.code==='auth/network-request-failed') msg='No internet connection. Try again.'; else if(err&&err.code==='auth/too-many-requests') msg='Too many attempts. Wait a few minutes and try again.'; else if(err&&err.code==='auth/operation-not-allowed') msg='Email sign-in is not enabled in Firebase yet.'; console.warn(err); }
    if(ok){ const u=firebase.auth().currentUser; let allowed=u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL; if(!allowed){ try{ const s=await db.collection('admins').doc(u.uid).get(); allowed=s.exists; }catch(_){} }
      if(!allowed){ await firebase.auth().signOut(); ok=false; msg='This account is not on the Revora team.'; }
      else { mode='admin'; view='dashboard'; document.body.classList.add('boot'); setTimeout(()=>document.body.classList.remove('boot'),2500); renderMode(); toast('Welcome back'); } }
    if(!ok)
    { btn.disabled=false; btn.textContent='Sign in'; const er=$('#l_err'); er.hidden=false; er.textContent=msg; const card=$('.lcard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } return; }
  if(e.target.id==='bookForm'){ e.preventDefault(); bookVisit('visit'); }
  if(e.target.id==='callForm'){ e.preventDefault(); bookVisit('call'); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='emi_down'||e.target.id==='emi_months'){ if(e.target.id==='emi_down') emiDown=Number(e.target.value); else emiMonths=Number(e.target.value); const c=cars.find(x=>x.id===storeSel); if(!c) return; const ev=emiCalc(+c.listing?.price||0); const box=e.target.closest('.emi'); if(box){ box.querySelector('.out b').textContent=inrF.format(ev.emi); box.querySelector('.out span').textContent=' / month for '+ev.n+' months'; box.querySelectorAll('.out > span')[0].textContent='Loan '+lakh(ev.P0); box.querySelectorAll('.lbl b')[0].textContent=lakh(ev.down); box.querySelectorAll('.lbl b')[1].textContent=ev.n+' months'; box.querySelector('.hint').textContent='Indicative only. Final EMI depends on the bank and your profile. Total payable '+lakh(ev.total+ev.down)+'.'; } return; }
  if(e.target.id==='ssearch'){ search=e.target.value; if(!storeSel){ const grid=$('#store .sgrid, #store .sbody .empty'); renderStore(); const inp=$('#ssearch'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); } } } });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('.row[data-sel]')){ selectCar(e.target.closest('.row').dataset.sel); }
  if(e.key==='Escape'){ if(lbIdx>=0||lbDoc){ lbIdx=-1; lbDoc=null; renderLightbox(); } else if(!$('#overlay').hidden) closeOverlay(); else if(sheetOpen){ unselect(); } }
  if(lbIdx>=0&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){ const n=photos(sel()).length; if(n>1){ lbIdx=(lbIdx+(e.key==='ArrowRight'?1:-1)+n)%n; renderLightbox(); } }
  if(e.key==='Enter'&&e.target.id==='noteIn'){ const c=sel(); if(c) actions.note(c); }
});
document.addEventListener('change',e=>{ if(e.target.id==='f_mode'){ const w=$('#bankWrap',e.target.closest('.box')); if(w) w.hidden=e.target.value!=='loan'; } });
$('#fileIn').addEventListener('change',e=>{ const files=[...e.target.files]; if(pendingDoc){ const f=files[0]; if(f) uploadDoc(f,pendingDoc); pendingDoc=null; return; } const imgs=files.filter(f=>f.type.startsWith('image/')); if(imgs.length) uploadPhotos(imgs); });
let sx=null,sT=null;
document.addEventListener('touchstart',e=>{ const t=e.target.closest('#lbView,.panel .ph'); if(t){ sx=e.touches[0].clientX; sT=t.id==='lbView'?'lb':'ph'; } },{passive:true});
document.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)<40) return; const c=sel(); const n=c?photos(c).length:0; if(n<2) return; const d=dx<0?1:-1;
  if(sT==='lb'){ lbIdx=(lbIdx+d+n)%n; renderLightbox(); } else { photoIdx=(photoIdx+d+n)%n; renderPanel(); } },{passive:true});
$('#search').addEventListener('input',e=>{ search=e.target.value; renderView(); });
$('#bell').addEventListener('click',()=>{ view='dashboard'; renderNav(); renderView(); const el=document.querySelector('.pend'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); });
window.addEventListener('resize',()=>{ if(sheetOpen) renderPanel(); });
window.addEventListener('hashchange',()=>{ if(mode==='store'){ storeSel=readHash(); storePh=0; renderStore(); } });
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; if(mode==='admin'&&view==='settings') renderView(); });
if('serviceWorker' in navigator&&location.protocol==='https:'&&!isNative()){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
let toastT; function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }

// ---------- boot ----------
renderMe();
(function boot(){
  const cfg=window.REVORA_FIREBASE;
  if(!cfg||!cfg.apiKey||/YOUR_/.test(cfg.apiKey)){ mode='setup'; loaded=true; renderMode(); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ console.error(e); mode='setup'; renderMode(); return; }
  db=firebase.firestore(); db.settings({ignoreUndefinedProperties:true,merge:true});
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){}
  // photo storage shim: photos live in Firestore as compressed data URLs (free plan, no Cloud Storage needed)
  const toDataURL=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(b); });
  assets={
    async upload(b){ const data=await toDataURL(b); if(data.length>950000) throw {code:'too_large',message:'Photo too large'}; const ref=await db.collection('photos').add({data,size:b.size,createdAt:new Date().toISOString()}); const id='fs:'+ref.id; photoCache[id]=data; return {id,url:data,sizeBytes:b.size,contentType:b.type}; },
    async delete(id){ if(String(id).startsWith('fs:')){ await db.collection('photos').doc(String(id).slice(3)).delete(); delete photoCache[id]; } return {deleted:true}; }
  };
  user={ async id(){ const u=firebase.auth().currentUser; return u?u.uid:null; }, async profiles(ids){ const o={}; ids.forEach(i=>o[i]={name:names[i]||'Admin'}); return o; } };
  // settings are public (EMI rate, WhatsApp number); defaults apply until the rules allow reading them
  db.collection('settings').doc('general').onSnapshot(s=>{ settings={...DEFAULT_SETTINGS,...(s.exists?s.data():{})}; if(mode==='admin') renderAll(); else if(mode==='store') renderStore(); },()=>{});
  let apptUnsub=null, adminUnsubs=[];
  firebase.auth().onAuthStateChanged(async u=>{
    let adminDoc=null; if(u&&u.email){ try{ const s=await db.collection('admins').doc(u.uid).get(); if(s.exists) adminDoc=s.data(); }catch(_){} }
    const isAdmin=!!(u&&u.email&&(u.email.toLowerCase()===ADMIN_EMAIL||adminDoc));
    canWrite=isAdmin; myId=u?u.uid:null; me={name:isAdmin?(adminDoc?.name||'Admin'):'',avatar:'',email:u?u.email||'':''}; if(myId&&isAdmin) names[myId]=me.name; renderMe();
    if(isAdmin&&!adminUnsubs.length){
      adminUnsubs.push(db.collection('admins').onSnapshot(s=>{ admins=s.docs.map(d=>({id:d.id,...d.data()})); admins.forEach(a=>names[a.id]=a.name||'Admin'); if(mode==='admin') renderAll(); },()=>{}));
      adminUnsubs.push(db.collection('buyers').onSnapshot(s=>{ buyers=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))); if(mode==='admin') renderAll(); },()=>{}));
    }
    if(!isAdmin&&adminUnsubs.length){ adminUnsubs.forEach(f=>f()); adminUnsubs=[]; buyers=[]; admins=[]; }
    // appointments are readable only by the admin, so subscribe after sign-in and drop it on sign-out
    if(isAdmin&&!apptUnsub){ apptUnsub=db.collection('appointments').onSnapshot(snap=>{ appts=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()})); if(mode==='admin') renderAll(); },err=>{ console.error(err); apptUnsub=null; }); }
    if(!isAdmin&&apptUnsub){ apptUnsub(); apptUnsub=null; appts=[]; }
    if(!authReady){ authReady=true; mode=isAdmin?'admin':'store'; if(isAdmin){ document.body.classList.add('boot'); setTimeout(()=>document.body.classList.remove('boot'),2500); } renderMode(); }
    else if(!isAdmin&&mode==='admin'){ mode='store'; renderMode(); }
  });
  const timer=setTimeout(()=>setLive('err','Slow connection'),10000);
  db.collection('cars').onSnapshot({includeMetadataChanges:true},snap=>{
    cars=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()})); loaded=true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); setLive('on','Live'); }
    if(mode==='admin') renderAll(); else if(mode==='store') renderStore();
  },err=>{ clearTimeout(timer); loaded=true; setLive('err','Connection lost'); if(mode==='admin') renderAll(); else if(mode==='store') renderStore(); console.error(err); });
})();
})();
